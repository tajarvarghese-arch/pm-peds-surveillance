name: Refresh CDC data + deploy

on:
  schedule:
    # 11:10 UTC daily. CDC NSSP posts Thu/Fri; a daily pull keeps the snapshot
    # fresh and accumulates history for f3zz-zga5, which CDC overwrites in place.
    - cron: '10 11 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Follow the branch tip, not the SHA the run was queued at. Without
          # this a re-run resurrects a stale parent and its data push is
          # rejected as non-fast-forward.
          ref: main
          # Rebase needs real history; the default shallow clone cannot do it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch CDC snapshots
        run: python scripts/fetch_data.py

      - name: Build urgent-care site census (Overture Maps)
        # Free public S3, no key. duckdb reads the parquet remotely with
        # predicate pushdown, so this stays cheap despite the dataset size.
        continue-on-error: true
        run: |
          pip install --quiet duckdb
          python scripts/fetch_places.py

      - name: Fetch urgent-care market supply
        # NPPES is a free public API. Same rule as literature: a failure here
        # must not cost us the surveillance refresh.
        continue-on-error: true
        run: python scripts/fetch_market.py

      - name: Rebuild closure ledger from the Internet Archive
        # Sundays, pushes and manual runs only. This step makes dozens of live
        # requests to operators' own websites plus the Wayback CDX index, and
        # market structure moves on a scale of months -- hitting third-party
        # sites every night would be rude and would buy nothing. Never allowed
        # to block the surveillance refresh either way.
        continue-on-error: true
        run: |
          DOW=$(date -u +%u)   # 7 = Sunday
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$DOW" != "7" ]; then
            echo "scheduled run on day $DOW — keeping the existing ledger"
            exit 0
          fi
          python scripts/fetch_closures.py

      - name: Fetch supporting literature
        # Europe PMC is a free public API with no key. A failure here must not
        # cost us the surveillance refresh, which is the actual product.
        continue-on-error: true
        run: python scripts/fetch_literature.py

      - name: Archive activity-level snapshot
        run: python scripts/archive_history.py

      - name: Commit refreshed data
        # Never allowed to block the deploy. The Pages artifact is built from the
        # working tree, which already holds fresh data whether or not the commit
        # lands. Committing only exists to accumulate data/history/ over time.
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "data: CDC refresh $(date -u +%Y-%m-%d)"

          # A re-run checks out the SHA the run was queued at, not the current
          # tip -- so if an earlier run already pushed data, this push is
          # rejected as non-fast-forward. Rebase onto the live branch and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/main (attempt $attempt)"
            git fetch origin main
            # Regenerated data always wins -- it is derived, never hand-edited.
            git rebase -X ours origin/main || { git rebase --abort || true; break; }
          done
          echo "could not push refreshed data; deploy continues with fresh working tree"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
